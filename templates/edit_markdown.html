{% extends "MAESTRA.html" %}

{% block titulo %}

{% endblock %}


{% block estilos %}

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    
    <!-- Luego markmap-view y markmap-lib -->
    <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.15.4"></script>
    <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.15.4"></script>
    
    <!-- Monaco Editor (VS Code) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>

    <style>
        /* * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        } */

        section.general_element {
            padding: 10px;
        }
        
        .content {
            display: flex;
            height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            overflow: hidden;
            width: 100%;
        }
        
        #editor-container {
            width: 45%;
            display: flex;
            flex-direction: column;
            background: #1e1e1e;
            border-right: 1px solid #3e3e42;
        }
        
        .header {
            padding: 12px 20px;
            background: #252526;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        h1 {
            font-size: 14px;
            color: #cccccc;
            font-weight: 500;
            flex: 1;
        }
        
        .btn-save {
            padding: 5px 14px;
            background: #0e639c;
            color: white;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .btn-save:hover {
            background: #1177bb;
        }
        
        .btn-save:active {
            background: #0d5a8f;
        }
        
        #editor {
            flex: 1;
            width: 100%;
        }
        
        .status-bar {
            padding: 4px 12px;
            background: #007acc;
            color: white;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 22px;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        #preview {
            width: 85%;
            position: relative;
            background: #1e1e1e;
            overflow: hidden;
        }
        
        #markmap {
            width: 100%;
            height: 100%;
        }
        
        /* Estilos para forzar visibilidad de líneas en markmap */
        svg.markmap {
            background: #1e1e1e;
        }
        
        .markmap-node > circle {
            stroke-width: 3px !important;
        }
        
        .markmap-node > text {
            fill: #d4d4d4 !important;
            font-size: 15px !important;
            font-weight: 400 !important;
        }
        
        .markmap-link {
            fill: none !important;
            stroke-width: 3px !important;
            opacity: 0.8 !important;
        }
        
        .status {
            color: #4ec9b0;
            font-size: 11px;
        }


        @media (max-width: 768px) {
            .content {
                flex-direction: column;
            }
            #editor-container {
                width: 95%;
                height: 40vh;
            }
            
            #editor-container * {
                font-size: 9px;
            }

            #markmap {
                height: 50vh;
                /* width: 500px; */
            }

            div.view-line {
                height: 8px !important;
            }
        }
    </style>

{% endblock %}


{% block contenido %}

<div class="content">
    
    <div id="editor-container">
        <div class="header">
            <h1>🗺️ Markmap Editor</h1>
            <button class="btn-save" onclick="saveMarkdown()">
                <span>💾</span>
                <span>Guardar</span>
            </button>
        </div>
        
        <div id="editor"></div>
        
        <div class="status-bar">
            <div class="status-item">
                <span>📄</span>
                <span>md.md</span>
            </div>
            <div class="status-item" style="margin-left: auto;">
                <span id="status">Listo</span>
            </div>
        </div>
    </div>

    <div id="preview">
        <svg id="markmap"></svg>
    </div>
    
    <form id="form" method="POST" style="display: none;">
        <textarea name="markdown" id="markdown-input"></textarea>
    </form>

</div>

{% endblock %}



{% block scripts %}

<script>
        const svg = document.getElementById("markmap");
        const statusEl = document.getElementById("status");
        const form = document.getElementById("form");
        const markdownInput = document.getElementById("markdown-input");
        
        let editor;
        let mm = null;

        // Paleta de colores VS Code más vibrantes
        const vsCodeColors = [
            '#4ec9b0', // Cyan/Turquoise - Nivel 1
            '#ce9178', // Orange/Brown - Nivel 2
            '#dcdcaa', // Yellow - Nivel 3
            '#c586c0', // Purple - Nivel 4
            '#9cdcfe', // Light Blue - Nivel 5
            '#4fc1ff', // Bright Blue - Nivel 6
            '#b5cea8', // Light Green - Nivel 7
        ];

        // Inicializar Monaco Editor
        require.config({ 
            paths: { 
                'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' 
            } 
        });

        require(['vs/editor/editor.main'], function() {
            editor = monaco.editor.create(document.getElementById('editor'), {
                value: `{{ markdown }}`,
                language: 'markdown',
                theme: 'vs-dark',
                automaticLayout: true,
                fontSize: 14,
                lineNumbers: 'on',
                minimap: { enabled: true },
                scrollBeyondLastLine: false,
                wordWrap: 'on',
                fontFamily: "'Cascadia Code', 'Fira Code', 'Consolas', monospace",
                fontLigatures: true,
                renderWhitespace: 'selection',
                bracketPairColorization: { enabled: true },
                guides: {
                    bracketPairs: true,
                    indentation: true
                }
            });

            // Render inicial
            renderMarkmap();

            // Actualizar en tiempo real
            let timeout;
            editor.onDidChangeModelContent(() => {
                clearTimeout(timeout);
                statusEl.textContent = "⟳ Actualizando...";
                timeout = setTimeout(renderMarkmap, 400);
            });

            // Comando para guardar con Ctrl+S
            editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, () => {
                saveMarkdown();
            });
        });

        function renderMarkmap() {
            if (!editor) return;
            
            const md = editor.getValue();
            
            try {
                const transformer = new markmap.Transformer();
                const { root } = transformer.transform(md);
                
                if (!mm) {
                    mm = markmap.Markmap.create(svg, {
                        duration: 500,
                        nodeMinHeight: 22,
                        spacingVertical: 10,
                        spacingHorizontal: 120,
                        paddingX: 12,
                        autoFit: true,
                        color: (node) => {
                            const depth = node.state.depth || 0;
                            return vsCodeColors[depth % vsCodeColors.length];
                        },
                        // Aumentar grosor de líneas
                        initialExpandLevel: 10,
                    }, root);
                    
                    // Forzar estilos después de crear
                    setTimeout(() => {
                        svg.querySelectorAll('.markmap-link').forEach(link => {
                            link.style.strokeWidth = '3px';
                            link.style.opacity = '0.9';
                        });
                        svg.querySelectorAll('.markmap-node circle').forEach(circle => {
                            circle.style.strokeWidth = '3px';
                        });
                    }, 100);
                } else {
                    mm.setData(root);
                    mm.fit();
                    
                    // Forzar estilos en actualización
                    setTimeout(() => {
                        svg.querySelectorAll('.markmap-link').forEach(link => {
                            link.style.strokeWidth = '3px';
                            link.style.opacity = '0.9';
                        });
                    }, 100);
                }
                
                statusEl.textContent = "✓ Actualizado";
                setTimeout(() => statusEl.textContent = "Listo", 2000);
            } catch (error) {
                console.error("Error al renderizar:", error);
                statusEl.textContent = "✗ Error: " + error.message;
            }
        }
        
        function saveMarkdown() {
            if (!editor) return;
            
            statusEl.textContent = "💾 Guardando...";
            markdownInput.value = editor.getValue();
            form.submit();
        }
        
        // Ajustar al redimensionar
        window.addEventListener('resize', () => {
            if (mm) {
                setTimeout(() => mm.fit(), 100);
            }
        });
    </script>

{% endblock %}
